<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jordan Eldridge — JXE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#fbfbfd;
    --card:#ffffff;
    --ink:#1d1d1f;
    --gray:#6e6e73;
    --gray-2:#86868b;
    --line:#d2d2d7;
    --fill:#f5f5f7;
    --fill-hover:#e8e8ed;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:380px;
    background:var(--card);
    border-radius:28px;
    padding:44px 36px 36px;
    box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 24px 48px -20px rgba(0,0,0,0.12);
  }

  .logo{
    display:block;
    height:34px;
    width:auto;
    margin:0 auto 30px;
  }

  .name-block{
    text-align:center;
    margin-bottom:34px;
  }
  .name-block h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  .name-block .role{
    margin-top:6px;
    font-size:15px;
    font-weight:500;
    color:var(--gray);
    letter-spacing:-0.01em;
  }

  .qr-card{
    background:var(--fill);
    border-radius:20px;
    padding:22px;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:28px;
  }
  #qrcode{
    background:#fff;
    padding:12px;
    border-radius:14px;
    line-height:0;
  }
  #qrcode img{ display:block; border-radius:4px; }
  .qr-caption{
    margin-top:14px;
    font-size:13px;
    font-weight:500;
    color:var(--gray);
    letter-spacing:-0.01em;
  }

  .btn-primary{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:16px 18px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:980px;
    font-family:inherit;
    font-weight:600;
    font-size:16px;
    letter-spacing:-0.01em;
    text-decoration:none;
    cursor:pointer;
    margin-bottom:16px;
    transition:opacity .15s ease, transform .15s ease;
  }
  .btn-primary:hover{ opacity:0.88; }
  .btn-primary:active{ transform:scale(0.98); }
  .btn-primary:focus-visible{ outline:2px solid #0071e3; outline-offset:2px; }

  .social-row{
    display:flex;
    justify-content:center;
    gap:12px;
  }
  .social-btn{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:var(--fill);
    color:var(--ink);
    text-decoration:none;
    transition:background .15s ease, transform .15s ease;
  }
  .social-btn:hover{ background:var(--fill-hover); }
  .social-btn:active{ transform:scale(0.94); }
  .social-btn:focus-visible{ outline:2px solid #0071e3; outline-offset:2px; }
  .social-btn svg{ width:18px; height:18px; }

  .foot-note{
    margin-top:26px;
    text-align:center;
    font-size:12.5px;
    color:var(--gray-2);
    letter-spacing:-0.01em;
  }

</style>
</head>
